{% for closure in closures %}
    <div class="d-flex justify-content-between align-items-center border-top py-2">
        <span><strong>{{ closure.facility.name }}</strong> · {{ closure.resource.name|default:"All courts" }} · {{ closure.start_datetime|date:"M j, Y g:i A" }}–{{ closure.end_datetime|date:"g:i A" }} · {{ closure.reason }}</span>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="delete_closure">
            <input type="hidden" name="closure_id" value="{{ closure.pk }}">
            <button class="btn btn-outline-danger btn-sm" type="submit">Remove</button>
        </form>
    </div>
{% empty %}
    <p class="text-body-secondary mb-0">No closures scheduled.</p>
{% endfor %}
