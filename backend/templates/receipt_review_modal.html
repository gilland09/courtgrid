<div class="cg-modal-overlay" data-receipt-modal aria-hidden="true">
    <section class="cg-modal-card cg-receipt-review-card p-3" role="dialog" aria-modal="true" aria-labelledby="receipt-review-title">
        <div class="d-flex justify-content-between gap-2"><h2 class="h5" id="receipt-review-title">Receipt · <span data-receipt-reference></span></h2><button type="button" class="btn-close" data-modal-close aria-label="Close"></button></div>
        <img class="cg-receipt-review-image" data-receipt-image alt="Uploaded payment receipt" hidden>
        <iframe class="cg-receipt-review-frame" data-receipt-frame title="Uploaded payment receipt" hidden></iframe>
        <a data-receipt-link target="_blank" rel="noopener">Open receipt in new tab</a>
    </section>
</div>
