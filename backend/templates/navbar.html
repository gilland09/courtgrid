<nav class="navbar navbar-expand-lg {% if user.is_authenticated and user.is_staff %}navbar-dark bg-dark{% else %}navbar-light bg-light{% endif %}">
    <div class="container">
        <a class="navbar-brand" href="{% if user.is_authenticated and user.is_staff %}{% url 'admin_dashboard' %}{% else %}{% url 'home' %}{% endif %}">
            Naval Court Booking
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                {% if user.is_authenticated %}
                    {% if user.is_staff %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'admin_dashboard' %}">Admin Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'admin:facilities_facility_changelist' %}">Manage Facilities</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'admin:facilities_facilityclosure_changelist' %}">Manage Closures</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/api/bookings/my/">My Bookings</a></li>
                    {% endif %}
                {% endif %}
            </ul>
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-flex">
                    {% csrf_token %}
                    <button type="submit" class="btn {% if user.is_staff %}btn-outline-light{% else %}btn-outline-secondary{% endif %}">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-primary" href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>
    </div>
</nav>
